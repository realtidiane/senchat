services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: senchat_root
      MYSQL_DATABASE: senchat
      MYSQL_USER: senchat
      MYSQL_PASSWORD: senchat_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
